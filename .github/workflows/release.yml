name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          mkdir -p dist
          platforms=(
            "darwin/amd64"
            "darwin/arm64"
            "linux/amd64"
            "linux/arm64"
            "windows/amd64"
          )
          for platform in "${platforms[@]}"; do
            GOOS="${platform%/*}"
            GOARCH="${platform#*/}"
            output="dist/agent-session-manager-${GOOS}-${GOARCH}"
            if [ "$GOOS" = "windows" ]; then
              output="${output}.exe"
            fi
            echo "Building $GOOS/$GOARCH..."
            GOOS=$GOOS GOARCH=$GOARCH go build -ldflags="-s -w" -o "$output" .
          done

      - name: Generate release body
        env:
          TAG_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## What's Changed"
            echo ""

            # Categorize commits
            if PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null); then
              RANGE="${PREV_TAG}..HEAD"
              CHANGELOG_LINK="${PREV_TAG}...${TAG_NAME}"
            else
              RANGE="HEAD"
              CHANGELOG_LINK=""
            fi

            features=""
            fixes=""
            other=""

            while IFS= read -r sha; do
              subject=$(git show -s --format=%s "$sha")
              author=$(git show -s --format=%an "$sha")
              login=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}" --jq '.author.login // empty')
              if [ -n "$login" ]; then
                author="@${login}"
              fi
              msg="${subject} by ${author} in $(git rev-parse --short "$sha")"
              if echo "$msg" | grep -qiE '^feat(\(|:|\!)'; then
                features="${features}\n- ${msg}"
              elif echo "$msg" | grep -qiE '^fix(\(|:|\!)'; then
                fixes="${fixes}\n- ${msg}"
              else
                other="${other}\n- ${msg}"
              fi
            done < <(git log "$RANGE" --format=%H)

            if [ -n "$features" ]; then
              echo "### New Features"
              echo ""
              echo -e "$features"
              echo ""
            fi

            if [ -n "$fixes" ]; then
              echo "### Bug Fixes"
              echo ""
              echo -e "$fixes"
              echo ""
            fi

            if [ -n "$other" ]; then
              echo "### Other Changes"
              echo ""
              echo -e "$other"
              echo ""
            fi

            if [ -n "$CHANGELOG_LINK" ]; then
              echo "**Full Changelog:** https://github.com/danpiths/agent-session-manager/compare/${CHANGELOG_LINK}"
              echo ""
            fi

            echo "---"
            echo ""
            echo "## Install"
            echo ""
            echo "Pick your platform and run one command:"
            echo ""
            echo "**macOS (Apple Silicon)**"
            echo '```bash'
            echo "curl -L https://github.com/danpiths/agent-session-manager/releases/download/${TAG_NAME}/agent-session-manager-darwin-arm64 -o /usr/local/bin/agent-session-manager && chmod +x /usr/local/bin/agent-session-manager"
            echo '```'
            echo ""
            echo "**macOS (Intel)**"
            echo '```bash'
            echo "curl -L https://github.com/danpiths/agent-session-manager/releases/download/${TAG_NAME}/agent-session-manager-darwin-amd64 -o /usr/local/bin/agent-session-manager && chmod +x /usr/local/bin/agent-session-manager"
            echo '```'
            echo ""
            echo "**Linux (x86_64)**"
            echo '```bash'
            echo "sudo curl -L https://github.com/danpiths/agent-session-manager/releases/download/${TAG_NAME}/agent-session-manager-linux-amd64 -o /usr/local/bin/agent-session-manager && sudo chmod +x /usr/local/bin/agent-session-manager"
            echo '```'
            echo ""
            echo "**Linux (ARM64)**"
            echo '```bash'
            echo "sudo curl -L https://github.com/danpiths/agent-session-manager/releases/download/${TAG_NAME}/agent-session-manager-linux-arm64 -o /usr/local/bin/agent-session-manager && sudo chmod +x /usr/local/bin/agent-session-manager"
            echo '```'
            echo ""
            echo "**Windows (PowerShell)**"
            echo '```powershell'
            echo 'Invoke-WebRequest -Uri https://github.com/danpiths/agent-session-manager/releases/download/'"${TAG_NAME}"'/agent-session-manager-windows-amd64.exe -OutFile "$env:LOCALAPPDATA\Microsoft\WindowsApps\agent-session-manager.exe"'
            echo '```'
            echo ""
            echo "**Go install**"
            echo '```bash'
            echo "go install github.com/danpiths/agent-session-manager@${TAG_NAME}"
            echo '```'
          } > release_body.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_body.md
          files: dist/*
